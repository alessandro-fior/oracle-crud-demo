services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
    ports:
      - "${ORACLE_PORT:-1522}:1521"
    healthcheck:
      test: ["CMD", "/opt/oracle-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
